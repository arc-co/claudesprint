[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudesprint"
version = "2.0.0"
description = "ClaudeSprint - Autonomous workflow orchestration for AI-driven development"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ClaudeSprint Team" }
]
keywords = ["ai", "workflow", "orchestration", "claude", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "rich>=14.0.0",
    "typer>=0.15.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "mypy>=1.0.0",
]
browser = [
    "playwright>=1.40.0",
]
all = [
    "claudesprint[dev,browser]",
]

[project.scripts]
claudesprint = "claudesprint.cli:app"
claudesprint-tools = "claudesprint.tools.cli:main"

[tool.hatch.build]
packages = ["src/claudesprint"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/prompts",
    "/schemas",
    "/scripts",
    "/tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
