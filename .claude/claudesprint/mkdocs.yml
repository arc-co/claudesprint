site_name: ClaudeSprint Documentation
docs_dir: docs
repo_url: https://github.com/arc-co/claudesprint
repo_name: arc-co/claudesprint

theme:
  name: material

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - Core Concepts:
    - Architecture: concepts/architecture.md
    - State & Artifacts: concepts/state-management.md
    - Workflow Steps: concepts/workflow-steps.md
  - Guides:
    - Specifications & Scoping: guides/specifications-and-scoping.md
    - Configuration: guides/configuration.md
    - Browser Automation: guides/browser-automation.md
    - Cost Management: guides/cost-management.md
    - Advanced Workflows: guides/advanced-workflows.md
  - Reference:
    - CLI Commands: reference/cli-commands.md
    - JSON Schemas: reference/schema-reference.md
    - Troubleshooting: reference/troubleshooting.md
  - Development:
    - Contributing: development/contributing.md
    - Customizing Prompts: development/prompt-engineering.md
    - Engine Internals: development/engine-internals.md

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
