<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClaudeSprint</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="tui">
    <div class="section header">
        <span class="label">ClaudeSprint</span>
        <span class="right"><span id="throbber" class="throbber hidden"></span> Status: <span id="conn-status">...</span></span>
    </div>

    <div class="section">
        <div class="section-title">Sprint</div>
        <div class="row">
            <span>ID: <span id="sprint-id">-</span></span>
            <span>Issues: <span id="issue-count">0/0</span></span>
        </div>
    </div>

    <div class="section board-section">
        <div class="section-title">Task Board</div>
        <div class="task-board">
            <div class="board-column" data-status="pending">
                <div class="column-header">PENDING</div>
                <div class="column-content" id="board-pending"></div>
            </div>
            <div class="board-column" data-status="in_progress">
                <div class="column-header">IN PROGRESS</div>
                <div class="column-content" id="board-in-progress"></div>
            </div>
            <div class="board-column" data-status="completed">
                <div class="column-header">COMPLETED</div>
                <div class="column-content" id="board-completed"></div>
            </div>
            <div class="board-column" data-status="blocked">
                <div class="column-header">BLOCKED</div>
                <div class="column-content" id="board-blocked"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Issue</div>
        <div id="issue-name">Waiting...</div>
        <div class="row meta">
            <span>Step: <span id="current-step">-</span></span>
            <span>Elapsed: <span id="step-elapsed">-</span></span>
            <span>Retry: <span id="retry-count">0</span>/<span id="max-retry">5</span></span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Workflow</div>
        <div class="workflow">
            <span id="wf-docs" class="step" data-step="read-docs">[ ] docs</span>
            <span class="arrow">&gt;</span>
            <span id="wf-impl" class="step" data-step="implement">[ ] impl</span>
            <span class="arrow">&gt;</span>
            <span id="wf-tests" class="step" data-step="write-tests">[ ] tests</span>
            <span class="arrow">&gt;</span>
            <span id="wf-run" class="step" data-step="run-tests">[ ] run</span>
            <span class="arrow">&gt;</span>
            <span id="wf-fix" class="step" data-step="fix-tests">[ ] fix</span>
            <span class="arrow">&gt;</span>
            <span id="wf-review" class="step" data-step="code-review">[ ] review</span>
            <span class="arrow">&gt;</span>
            <span id="wf-commit" class="step" data-step="commit-changes">[ ] commit</span>
        </div>
    </div>

    <div class="section output-section">
        <div class="section-title">Output <span id="clear-output" class="btn">clear</span></div>
        <div id="output-container"><pre id="output-content"></pre></div>
    </div>
</div>
<script src="/static/dashboard.js"></script>
</body>
</html>
